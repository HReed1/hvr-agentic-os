[project]
name = "context-benchmarking"
version = "0.1.0"
description = "Automated Context Benchmarking Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.29.0",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "tiktoken"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
