name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Flake8
        run: |
          # E501: line too long — agent prompts are deliberately verbose
          # W503: line break before binary operator — black-compatible
          # E402: module-level import not at top — interceptors.py requires it
          flake8 agent_app/ api/ utils/ tests/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 agent_app/ api/ utils/ tests/ \
            --count --exit-zero --max-line-length=150 --ignore=E501,W503,E402 --statistics

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>&1 | tail -5

      - name: Run test suite
        env:
          # Prevent ADK/GCP SDK from requiring real credentials during unit tests
          GOOGLE_CLOUD_PROJECT: "test-project"
          GOOGLE_CLOUD_LOCATION: "us-central1"
        run: |
          python -m pytest tests/ -k "not docker" --tb=short -q

  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt 2>&1 | tail -5

      - name: Audit Python packages
        run: |
          # Extract ignored CVE IDs from .pip-audit-ignore (skip comments/blanks)
          IGNORE_FLAGS=""
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r line; do
              line=$(echo "$line" | sed 's/#.*//' | xargs)
              [ -z "$line" ] && continue
              IGNORE_FLAGS="$IGNORE_FLAGS --ignore-vuln $line"
            done < .pip-audit-ignore
          fi
          echo "Ignoring: $IGNORE_FLAGS"
          pip-audit --desc $IGNORE_FLAGS

  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table
